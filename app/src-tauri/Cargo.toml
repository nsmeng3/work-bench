[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "uuid",
    "time",
] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
# m4-4.4 · disp_soft_delete：跨平台系统回收站（macOS Finder / Windows Recycle Bin / freedesktop Trash）
# 版本：5.2.6（cargo add trash 当前稳定版；语义化版本约束 "5.2.6" 兼容 5.x 后续 patch）
trash = "5.2.6"
# m5-5.1 · 目录监听：跨平台文件系统事件（macOS FSEvents / Windows ReadDirectoryChangesW / Linux inotify）
# 版本：8.2.0（cargo add notify 当前稳定版；语义化版本约束 "8.2.0" 兼容 8.x 后续 patch）
notify = "8.2.0"
# m5-5.2 · 忽略规则引擎：ByPattern 完整路径 glob 匹配（"**/*.part" / "**/build/**"）
# 版本：0.3.4（cargo add glob 当前稳定版；语义化版本约束 "0.3.4" 兼容 0.3.x 后续 patch）
glob = "0.3.4"
# m6-6.2 · watch 调度器：目录树遍历（walkdir）
# 版本：2.4.0（cargo add walkdir 当前稳定版；语义化版本约束 "2.4.0" 兼容 2.x 后续 patch）
walkdir = "2.4.0"

[dev-dependencies]
tempfile = "3"
